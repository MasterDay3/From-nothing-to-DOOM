# Одна гра (emulator/*.s без змін) у своєму слоті ROM лаунчера.
# SLOT_START і SLOT_SIZE задає build.sh (-D), тому карта ROM описана в одному місці.
#
# Відмінності від emulator_c/rom.cfg:
#   * код і дані лежать у слоті, а не з $8000;
#   * вектори гри (NMI, RESET, IRQ) — в останніх 6 байтах слоту, а не на $FFFA:
#     справжні вектори CPU належать лаунчеру, він читає вектори гри звідси.
# Нульова сторінка і RAM — ті самі, що й в окремій збірці (лише одна гра працює
# одночасно), окрім $3FF0-$3FFF: там стан лаунчера.
MEMORY {
    ZP:   start = $0000, size = $0100, type = rw;
    RAM:  start = $0200, size = $3DF0, type = rw;
    SLOT: start = SLOT_START, size = SLOT_SIZE, type = ro, file = %O, fill = yes, fillval = $EA;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    BSS:      load = RAM,  type = bss, optional = yes;
    CODE:     load = SLOT, type = ro;
    RODATA:   load = SLOT, type = ro;
    VECTORS:  load = SLOT, type = ro, start = SLOT_START + SLOT_SIZE - 6;
}
